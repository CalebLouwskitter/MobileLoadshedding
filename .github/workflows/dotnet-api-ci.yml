name: .NET API CI/CD

on:
  push:
    branches: [ master ]
    paths:
      - 'IdleLoadsheddingAPI/**'
      - 'IdleLoadsheddingAPI.Tests/**'
      - 'SQL/**'
      - '.github/workflows/dotnet-api-ci.yml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'IdleLoadsheddingAPI/**'
      - 'IdleLoadsheddingAPI.Tests/**'
      - 'SQL/**'
      - '.github/workflows/dotnet-api-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test .NET API
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Restore dependencies
      run: dotnet restore IdleLoadsheddingAPI/IdleLoadsheddingAPI.csproj
      
    - name: Build API
      run: dotnet build IdleLoadsheddingAPI/IdleLoadsheddingAPI.csproj --configuration Release --no-restore
      
    - name: Restore test dependencies
      run: dotnet restore IdleLoadsheddingAPI.Tests/IdleLoadsheddingAPI.Tests.csproj
      
    - name: Run tests
      run: dotnet test IdleLoadsheddingAPI.Tests/IdleLoadsheddingAPI.Tests.csproj --configuration Release --no-restore --verbosity minimal --logger "trx;LogFileName=test-results.trx"
      
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/test-results.trx'
        
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build SQL Docker image
      run: |
        docker build -t idle-loadshedding-sql:${{ github.sha }} ./SQL
        docker tag idle-loadshedding-sql:${{ github.sha }} idle-loadshedding-sql:latest
        
    - name: Build API Docker image
      run: |
        docker build -t idle-loadshedding-webapi:${{ github.sha }} ./IdleLoadsheddingAPI
        docker tag idle-loadshedding-webapi:${{ github.sha }} idle-loadshedding-webapi:latest
        
    - name: Test Docker Compose setup
      run: |
        docker compose up -d
        sleep 30
        docker compose ps
        docker compose logs
        docker compose down
        
    - name: Save Docker images
      run: |
        docker save idle-loadshedding-sql:latest | gzip > sql-image.tar.gz
        docker save idle-loadshedding-webapi:latest | gzip > api-image.tar.gz
        
    - name: Upload Docker images as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: docker-images
        path: |
          sql-image.tar.gz
          api-image.tar.gz
        retention-days: 7

name: Code Quality

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  dotnet-format:
    name: .NET Code Formatting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Restore dependencies
      run: dotnet restore IdleLoadsheddingAPI/IdleLoadsheddingAPI.sln
      
    - name: Check code formatting
      run: dotnet format IdleLoadsheddingAPI/IdleLoadsheddingAPI.sln --verify-no-changes --verbosity diagnostic
      continue-on-error: true
      
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        
  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Check for outdated packages
      run: |
        dotnet list IdleLoadsheddingAPI/IdleLoadsheddingAPI.csproj package --outdated
        dotnet list IdleLoadsheddingAPI.Tests/IdleLoadsheddingAPI.Tests.csproj package --outdated
      continue-on-error: true
      
    - name: Check for vulnerable packages
      run: |
        dotnet list IdleLoadsheddingAPI/IdleLoadsheddingAPI.csproj package --vulnerable --include-transitive
        dotnet list IdleLoadsheddingAPI.Tests/IdleLoadsheddingAPI.Tests.csproj package --vulnerable --include-transitive
      continue-on-error: true

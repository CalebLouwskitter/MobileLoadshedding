name: PR Validation

on:
  pull_request:
    branches: [ master, develop ]

jobs:
  validate:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Check PR title
      uses: amannn/action-semantic-pull-request@v5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        types: |
          feat
          fix
          docs
          style
          refactor
          perf
          test
          build
          ci
          chore
      continue-on-error: true
        
    - name: Check for merge conflicts
      run: |
        git fetch origin ${{ github.base_ref }}
        git merge-base --is-ancestor origin/${{ github.base_ref }} HEAD || (echo "Branch is behind base" && exit 1)
        
    - name: Check file size
      run: |
        echo "Checking for large files..."
        find . -type f -size +10M -not -path "./.git/*" -not -path "./MobileLoadshedding/unityLibrary/*" | while read file; do
          echo "Warning: Large file detected: $file"
        done
        
    - name: Count changed files
      run: |
        FILES_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | wc -l)
        echo "Files changed: $FILES_CHANGED"
        if [ $FILES_CHANGED -gt 100 ]; then
          echo "Warning: PR contains more than 100 changed files. Consider breaking it into smaller PRs."
        fi
        
  comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: validate
    if: always()
    
    steps:
    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ PR validation checks completed! Please review any warnings above.'
          })
